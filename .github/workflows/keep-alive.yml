name: Keep Render Alive

on:
  schedule:
    # Pings your bot every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: curl -s -o /dev/null -w "%{http_code}" https://invertcorporation-invertbot.onrender.com || exit 0
